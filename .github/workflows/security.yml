name: Security audit

on:
  push:
    branches: [main, qa, dev]
  pull_request:
  schedule:
    # Re-run weekly so newly-published advisories are caught even without a push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (advisories, bans, sources, licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      # Install the latest cargo-deny directly rather than via cargo-deny-action:
      # the action bundles an older cargo-deny that fails to parse newer
      # advisory-db entries (e.g. RUSTSEC-2026-0066).
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo-deny
        run: cargo deny check advisories bans sources licenses
