# Version updates are monthly and grouped into one PR per ecosystem.
# Security updates are separate and run whenever an advisory is published.
version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: monthly
    day: monday
    time: 06:00
    timezone: Etc/UTC
  target-branch: dev
  open-pull-requests-limit: 10
  commit-message:
    prefix: deps
    prefix-development: deps-dev
    include: scope
  labels:
  - dependencies
  - rust
  groups:
    all:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
    day: monday
    time: 06:00
    timezone: Etc/UTC
  target-branch: dev
  open-pull-requests-limit: 5
  commit-message:
    prefix: ci
    include: scope
  labels:
  - dependencies
  - github-actions
  groups:
    all:
      patterns:
      - '*'
