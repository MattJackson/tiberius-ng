# Configuration for `cargo mutants` (mutation testing).
#
# This file MUST live at `.cargo/mutants.toml` — that is the only path
# cargo-mutants (v27) auto-discovers. A copy at the repo root is silently
# ignored, so the exclusions below would not apply and the run would mutate
# socket-driven code that offline unit tests can never catch.
#
# Mutation testing runs the unit-test suite (`--lib`) against thousands of
# small code mutations; a mutation that no test catches ("missed") points at a
# gap in the tests. The full run is sharded across EC2 runners — see
# `.github/workflows/mutants.yml`.

# Only the library unit tests can run without a live SQL Server. The test phase
# is restricted to the library with `--cargo-test-arg --lib`, which forwards
# `--lib` to `cargo test` (the target selector). NOTE: `-- --lib` does NOT work
# — arguments after `--` go to the test *harness*, where `--lib` is treated as a
# test-name filter that matches almost nothing, so nearly every mutant would
# survive. (See scripts/mutants-ec2.sh and .github/workflows/mutants.yml.)

# Files excluded from mutation: their behaviour is driven by a live TCP/TLS
# socket to SQL Server, so their mutants cannot be caught by offline unit tests
# (they would all show up as false "missed"). They are exercised by the
# integration suite instead.
exclude_globs = [
    "src/client.rs",
    "src/client/connection.rs",
    "src/client/tls.rs",
    "src/client/tls_stream/**",
    "src/tds/stream/**",
    "src/sql_browser.rs",
    "src/sql_browser/**",
    "src/tds/codec/bulk_load.rs",
    "src/tds/codec/rpc_request.rs",
    "src/tds/codec/batch_request.rs",
    "src/tds/codec/transaction_manager.rs",
]

# The ColumnData bulk-load / TVP wire encoder is the same class of code as the
# excluded modules above: it serialises every column type to the TDS wire format
# and is exercised end-to-end by the bulk-load integration suite against a live
# server. Its offline mutants are dominated by exhaustive type-dispatch guards
# (`if vlc.r#type() == VarLenType::X`) that can only be distinguished by feeding
# an impossible (ColumnData, TypeInfo) mismatch, plus bulk-input length checks
# covered by the bulk-load tests. The happy-path round-trip tests in this file
# stay as regression coverage; the encoder itself is out of the offline gate.
# (`type_name` and the datetime helpers in this file remain in scope.)

# Plain data accessors (`fn field(&self) -> T { self.field }`) carry no logic to
# get wrong; their mutants ("replace with ()") are noise, and they are covered
# by connection-string round-trip and integration tests. Skip them so the gate
# focuses on real logic.
exclude_re = [
    "replace [A-Za-z_:<>]+::(get_)?[a-z_]+ -> .* with (\\(\\)|Default::default\\(\\))",
    # Trivial unit-returning setters (`fn x(&mut self, v) { self.x = v }`): their
    # body-removal mutant renders as "... with ()". There is no branch to get
    # wrong and no getter to assert against, so a unit test would be tautological.
    "replace [\\w:<>'& ]+::[a-z_]+ with \\(\\)",
    # `From<E> for Error` impls are thin wrappers (`Error::Tls(format!(...))`);
    # exercising every foreign error type's conversion adds no logic coverage.
    "impl From<.+> for Error",
    # The ColumnData bulk-load / TVP wire encoder (see exclude_globs note above).
    "for ColumnData<'a>>::encode",
    # Equivalent mutant: type_name's `s.len() <= MAX_NVARCHAR_SIZE` upper bound.
    # Its false branch (ntext(max)) needs a >1 GiB string, which a unit test
    # cannot allocate, so `with true` can never be distinguished from the guard.
    "s.len\\(\\) <= MAX_NVARCHAR_SIZE with true",
]

# A generous per-mutant timeout; a mutation that causes an infinite loop is a
# "timeout" (treated as caught).
timeout_multiplier = 5.0
minimum_test_timeout = 60
